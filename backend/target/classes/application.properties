spring.application.name=inventory-management
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=change-this-development-secret-key-to-a-long-random-value
app.jwt.expiration=86400000

spring.jackson.serialization.write-dates-as-timestamps=false
